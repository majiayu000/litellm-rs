apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-gateway-config
  namespace: litellm-gateway
  labels:
    app.kubernetes.io/name: litellm-gateway
    app.kubernetes.io/component: config
data:
  gateway.yaml: |
    server:
      host: "0.0.0.0"
      port: 8000
      workers: 4
      timeout: 30
      max_body_size: 10485760

    providers:
      - name: "openai-primary"
        provider_type: "openai"
        api_key: "${OPENAI_API_KEY}"
        base_url: "https://api.openai.com/v1"
        weight: 100.0
        priority: 0
        timeout: 30
        max_retries: 3
        models:
          - "gpt-4o"
          - "gpt-4.1-mini"
        tags:
          - "primary"
        enabled: true

      - name: "anthropic-backup"
        provider_type: "anthropic"
        api_key: "${ANTHROPIC_API_KEY}"
        base_url: "https://api.anthropic.com"
        weight: 80.0
        priority: 1
        timeout: 30
        max_retries: 3
        models:
          - "claude-sonnet-4-20250514"
        tags:
          - "backup"
        enabled: true

    router:
      strategy: "latency_based"
      circuit_breaker:
        failure_threshold: 5
        recovery_timeout: 60
        min_requests: 10
        success_threshold: 3
      load_balancer:
        health_check_enabled: true

    storage:
      database:
        url: "${DATABASE_URL}"
        max_connections: 10
        connection_timeout: 30
        enabled: false
        auto_migrate: false
      redis:
        url: "${REDIS_URL}"
        max_connections: 10
        connection_timeout: 5
        enabled: false

    auth:
      enable_jwt: true
      enable_api_key: true
      jwt_secret: "${LITELLM_JWT_SECRET}"
      jwt_expiration: 3600
      api_key_header: "Authorization"
      allow_anonymous: false
      rbac:
        enabled: true
        default_role: "user"

    monitoring:
      metrics:
        enabled: true
        port: 9090
        path: "/metrics"
        interval_seconds: 15
      tracing:
        enabled: false
        endpoint: null
        service_name: "litellm-rs"
        sampling_rate: 0.1
      health:
        path: "/health"
        detailed: true
