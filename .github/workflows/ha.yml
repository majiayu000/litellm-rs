name: Two-gateway convergence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/server/**'
      - 'src/core/router/**'
      - 'src/core/budget/**'
      - 'src/storage/**'
      - 'src/config/**'
      - 'Cargo.*'
      - 'scripts/ha/**'
      - 'scripts/bench/gateway-overhead.yaml'
      - '.github/workflows/ha.yml'
  push:
    branches: [main]
    paths:
      - 'src/server/**'
      - 'src/core/router/**'
      - 'src/core/budget/**'
      - 'src/storage/**'
      - 'src/config/**'
      - 'Cargo.*'
      - 'scripts/ha/**'
      - 'scripts/bench/gateway-overhead.yaml'
      - '.github/workflows/ha.yml'
permissions:
  contents: read
concurrency:
  group: ha-${{ github.ref }}
  cancel-in-progress: true
jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: litellm_ha
        ports: ['5432:5432']
        options: >-
          --user postgres
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --user redis
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      HA_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/litellm_ha
      REDIS_URL: redis://127.0.0.1:6379
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ha-${{ hashFiles('Cargo.lock') }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2 redis==6.4.0
      - name: Build real gateway
        run: cargo build --locked --bin gateway --features postgres
      - name: Exercise two gateway processes
        run: python scripts/ha/two_gateways.py --binary target/debug/gateway --output ha-evidence
      - name: Retain node revisions and shared-state diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-gateway-evidence
          path: ha-evidence
          if-no-files-found: warn
