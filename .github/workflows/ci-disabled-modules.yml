name: CI Release Profile and Disabled Modules

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      features:
        description: Validated gateway release features
        value: ${{ jobs.release-profile.outputs.features }}
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-disabled-modules-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-all-features:
    name: Compile-check all features (including disabled modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # v1
        with:
          toolchain: 1.96.1

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-all-features-

      - name: cargo check --all-features
        run: cargo check --all-features

  release-profile:
    name: Test and lint shipped gateway features
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_FEATURES: postgres,sqlite,redis,s3,metrics,tracing,websockets,providers-extra,providers-extended,mcp-validation,a2a
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gateway_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret-key-for-ci
    outputs:
      features: ${{ steps.profile.outputs.features }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gateway_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Export release profile
        id: profile
        run: echo "features=$RELEASE_FEATURES" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # v1
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-profile-${{ hashFiles('**/Cargo.lock') }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev pkg-config libssl-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint release features
        run: cargo clippy --locked --all-targets --no-default-features --features "$RELEASE_FEATURES" -- -D warnings
      - name: Test release features
        run: cargo test --workspace --locked --no-default-features --features "$RELEASE_FEATURES"
