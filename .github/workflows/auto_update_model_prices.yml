name: Auto Update Model Prices

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      UPSTREAM_REPO: BerriAI/litellm
      UPSTREAM_REF: litellm_internal_staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Resolve immutable LiteLLM source
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_commit="$(gh api "repos/${UPSTREAM_REPO}/commits/${UPSTREAM_REF}" --jq .sha)"
          if [[ ! "${source_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid upstream commit: ${source_commit}" >&2
            exit 1
          fi
          source_url="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${source_commit}/model_prices_and_context_window.json"
          echo "source_commit=${source_commit}" >> "${GITHUB_OUTPUT}"
          echo "source_url=${source_url}" >> "${GITHUB_OUTPUT}"

      - name: Test pricing sync contract
        run: python3 -m unittest discover -s scripts/test -p 'test_sync_litellm_pricing.py'

      - name: Refresh runtime pricing catalog
        run: |
          python3 scripts/sync_litellm_pricing.py \
            --source-commit "${{ steps.upstream.outputs.source_commit }}" \
            --source-url "${{ steps.upstream.outputs.source_url }}"

      - name: Validate generated catalog
        run: |
          python3 scripts/sync_litellm_pricing.py \
            --source-commit "${{ steps.upstream.outputs.source_commit }}" \
            --source-url "${{ steps.upstream.outputs.source_url }}" \
            --check
          python3 -m unittest discover -s scripts/test -p 'test_sync_litellm_pricing.py'

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet -- \
            config/model_prices_extended.json \
            config/model_catalog_authority.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            config/model_prices_extended.json
            config/model_catalog_authority.json
          commit-message: "chore(pricing): refresh runtime catalog from LiteLLM"
          title: "chore(pricing): refresh runtime catalog from LiteLLM"
          body: |
            ## Automated runtime pricing refresh

            This PR updates the catalog embedded by `src/core/pricing.rs`.

            - Upstream: `BerriAI/litellm`
            - Immutable source commit: `${{ steps.upstream.outputs.source_commit }}`
            - Runtime catalog: `config/model_prices_extended.json`
            - Generated exact classification authority: `config/model_catalog_authority.json`
            - Reviewed decisions: `config/model_catalog_decisions.json` (not changed automatically)
            - Official and compatibility overrides: validated and applied after upstream rows

            Review the catalog diff before merging. First-party overrides are retained
            when LiteLLM differs from provider documentation. Classification is exact,
            provider-scoped, and fails if a pricing row lacks an explicit decision.
          branch: auto-update-runtime-model-prices
          delete-branch: true
